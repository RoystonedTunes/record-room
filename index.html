<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Record Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0A0C0F;
    --ink-raised:#141820;
    --ink-card:#191E27;
    --line:#242B36;
    --paper:#F2F0EA;
    --muted:#7C8290;
    --lime:#C6FF4D;
    --pink:#FF5D9E;
    --sky:#6FD3FF;
    --amber:#FFC15E;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;background:var(--ink);color:var(--paper);
    font-family:'Inter',sans-serif;min-height:100vh;
  }
  ::selection{background:var(--lime);color:var(--ink);}
  :focus-visible{outline:2px solid var(--lime);outline-offset:2px;}
  .wrap{max-width:760px;margin:0 auto;padding:44px 20px 90px;}
  .hero{display:flex;flex-direction:column;align-items:center;text-align:center;margin-bottom:34px;}
  .disc{
    width:120px;height:120px;border-radius:50%;position:relative;margin-bottom:18px;
    background:
      repeating-radial-gradient(circle at center, #0000 0px, #0000 3px, rgba(198,255,77,0.06) 4px, #0000 5px),
      radial-gradient(circle at center, var(--ink-card) 0 32%, #060709 32% 100%);
    box-shadow:0 0 0 1px rgba(198,255,77,0.15), 0 0 34px rgba(198,255,77,0.18), 0 0 60px rgba(255,93,158,0.08);
    display:flex;align-items:center;justify-content:center;
    animation:spin-in 1s ease-out;
  }
  @keyframes spin-in{from{transform:rotate(-70deg);opacity:0;}to{transform:rotate(0);opacity:1;}}
  .disc-label{
    width:50px;height:50px;border-radius:50%;background:var(--lime);color:var(--ink);
    display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono';
    font-size:10px;font-weight:500;
  }
  h1{font-family:'Fraunces',serif;font-weight:600;font-size:2rem;margin:0 0 6px;letter-spacing:-0.01em;}
  .tagline{color:var(--muted);font-size:0.92rem;margin:0;}
  .sides{
    display:flex;justify-content:center;gap:2px;margin:30px 0 34px;
    background:var(--ink-raised);border-radius:999px;padding:4px;width:fit-content;margin-left:auto;margin-right:auto;
  }
  .side-btn{
    font-family:'IBM Plex Mono';font-size:0.74rem;letter-spacing:0.8px;
    background:none;border:none;color:var(--muted);padding:9px 16px;border-radius:999px;
    cursor:pointer;transition:background .25s,color .25s;
  }
  .side-btn.active{background:var(--lime);color:var(--ink);}
  .panel{display:none;}
  .panel.active{display:block;animation:fade-up .3s ease;}
  @keyframes fade-up{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
  h2.panel-title{font-family:'Fraunces',serif;font-size:1.25rem;font-weight:600;margin:0 0 4px;}
  .panel-sub{color:var(--muted);font-size:0.84rem;margin:0 0 22px;}
  form.card{
    background:var(--ink-card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:22px;
    display:grid;grid-template-columns:1fr 1fr;gap:10px;
  }
  form.card.single{grid-template-columns:1fr;}
  form.card input, form.card textarea, form.card select{
    background:var(--ink);border:1px solid var(--line);color:var(--paper);
    border-radius:8px;padding:10px 12px;font-family:'Inter';font-size:0.88rem;width:100%;
  }
  form.card textarea{resize:vertical;min-height:80px;}
  form.card input::placeholder, form.card textarea::placeholder{color:var(--muted);}
  .full{grid-column:1 / -1;}
  .add-btn{
    grid-column:1 / -1;justify-self:start;
    background:var(--lime);color:var(--ink);border:none;border-radius:8px;
    padding:10px 18px;font-family:'IBM Plex Mono';font-size:0.76rem;font-weight:500;letter-spacing:0.5px;
    cursor:pointer;margin-top:2px;
  }
  .add-btn:hover{background:#d4ff70;}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px;}
  .chip{
    font-family:'IBM Plex Mono';font-size:0.72rem;letter-spacing:0.3px;
    padding:6px 13px;border-radius:999px;border:1px solid var(--line);background:var(--ink-raised);
    color:var(--muted);cursor:pointer;transition:all .15s;
  }
  .chip.active{color:var(--ink);border-color:transparent;}
  .tag{
    display:inline-block;font-family:'IBM Plex Mono';font-size:0.68rem;padding:2px 9px;border-radius:999px;
    margin-left:6px;color:var(--ink);
  }
  .search{margin-bottom:16px;}
  .search input{
    width:100%;background:var(--ink-card);border:1px solid var(--line);color:var(--paper);
    border-radius:8px;padding:10px 14px;font-family:'Inter';font-size:0.88rem;
  }
  .track{
    display:grid;grid-template-columns:24px 1fr auto;gap:12px;align-items:center;
    padding:12px 4px;border-bottom:1px solid var(--line);
  }
  .track:last-child{border-bottom:none;}
  .track .num{font-family:'IBM Plex Mono';color:var(--lime);font-size:0.8rem;}
  .track .info strong{display:block;font-family:'Fraunces';font-weight:600;font-size:0.98rem;}
  .track .info span{color:var(--muted);font-size:0.78rem;}
  .track .dur{font-family:'IBM Plex Mono';color:var(--muted);font-size:0.8rem;white-space:nowrap;display:flex;align-items:center;}
  .del{background:none;border:none;color:var(--pink);cursor:pointer;font-size:0.7rem;font-family:'IBM Plex Mono';margin-left:8px;}
  .entry{padding:16px 0;border-bottom:1px solid var(--line);}
  .entry:last-child{border-bottom:none;}
  .entry-date{font-family:'IBM Plex Mono';font-size:0.7rem;color:var(--sky);letter-spacing:0.4px;display:inline-block;margin-bottom:6px;}
  .entry h3{font-family:'Fraunces';font-weight:600;font-size:1.05rem;margin:0 0 6px;}
  .entry p{color:var(--muted);font-size:0.88rem;line-height:1.55;margin:0 0 8px;white-space:pre-wrap;}
  .post{
    background:var(--ink-card);border:1px solid var(--line);border-left:3px solid var(--lime);
    border-radius:10px;padding:14px 16px;margin-bottom:12px;
  }
  .post-head{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap;}
  .post-name{font-family:'Fraunces';font-weight:600;font-size:0.92rem;}
  .post-time{font-family:'IBM Plex Mono';font-size:0.68rem;color:var(--muted);}
  .post p{margin:0;font-size:0.88rem;line-height:1.5;color:var(--paper);white-space:pre-wrap;}
  .empty{text-align:center;color:var(--muted);font-size:0.86rem;padding:28px 0;font-style:italic;}
  .status{font-size:0.72rem;color:var(--muted);text-align:center;margin-top:34px;font-family:'IBM Plex Mono';}
  .notice{font-size:0.72rem;color:var(--muted);text-align:center;margin:-14px 0 20px;font-family:'IBM Plex Mono';}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <div class="disc"><div class="disc-label">33⅓</div></div>
    <h1>The Record Room</h1>
    <p class="tagline">Library. Journal. Talk. All under one blacklight.</p>
  </div>
  <div class="sides">
    <button class="side-btn active" data-side="A" onclick="flipTo('A')">LIBRARY</button>
    <button class="side-btn" data-side="B" onclick="flipTo('B')">JOURNAL</button>
    <button class="side-btn" data-side="C" onclick="flipTo('C')">TALK</button>
  </div>
  <section class="panel active" id="panel-A">
    <h2 class="panel-title">Library</h2>
    <p class="panel-sub">Every track, tagged by genre.</p>
    <form class="card" id="song-form">
      <input type="text" id="s-title" placeholder="Track title" required class="full">
      <input type="text" id="s-artist" placeholder="Artist" required>
      <input type="text" id="s-genre" placeholder="Genre (e.g. indie, hyperpop)" required>
      <input type="text" id="s-album" placeholder="Album">
      <input type="text" id="s-duration" placeholder="Duration (mm:ss)">
      <button type="submit" class="add-btn">+ add track</button>
    </form>
    <div class="chips" id="genre-chips-lib"></div>
    <div class="search"><input type="text" id="song-search" placeholder="Search title or artist…" oninput="renderSongs()"></div>
    <div id="song-list"></div>
  </section>
  <section class="panel" id="panel-B">
    <h2 class="panel-title">Journal</h2>
    <p class="panel-sub">Gigs, discoveries, whatever's on repeat.</p>
    <form class="card single" id="journal-form">
      <input type="text" id="j-title" placeholder="Entry title" required>
      <textarea id="j-body" placeholder="What happened? What did you hear?" required></textarea>
      <button type="submit" class="add-btn">+ add entry</button>
    </form>
    <div id="journal-list"></div>
  </section>
  <section class="panel" id="panel-C">
    <h2 class="panel-title">Talk</h2>
    <p class="panel-sub">Open floor — say what you're spinning.</p>
    <p class="notice">shared feed — visible to anyone who opens this page</p>
    <form class="card" id="talk-form">
      <input type="text" id="t-name" placeholder="Your name" required>
      <input type="text" id="t-genre" placeholder="Genre tag" required>
      <textarea id="t-body" placeholder="What's on your mind?" required class="full"></textarea>
      <button type="submit" class="add-btn">+ post</button>
    </form>
    <div class="chips" id="genre-chips-talk"></div>
    <div id="talk-list"></div>
  </section>
  <p class="status" id="status">loading…</p>
</div>
<script>
let songs = JSON.parse(localStorage.getItem('rr_songs')||'[]');
let journal = JSON.parse(localStorage.getItem('rr_journal')||'[]');
let talk = JSON.parse(localStorage.getItem('rr_talk')||'[]');
let libFilter = 'all', talkFilter = 'all';
const PALETTE = [
  {bg:'#C6FF4D'}, {bg:'#FF5D9E'}, {bg:'#6FD3FF'}, {bg:'#FFC15E'}
];
function genreColor(g){
  const s = (g||'other').toLowerCase();
  let h = 0; for(let i=0;i<s.length;i++) h = (h*31 + s.charCodeAt(i)) % PALETTE.length;
  return PALETTE[h].bg;
}
function renderAll(){ renderSongs(); renderJournal(); renderTalk(); document.getElementById('status').textContent='saved on this device'; }
function saveSongs(){ localStorage.setItem('rr_songs', JSON.stringify(songs)); }
function saveJournal(){ localStorage.setItem('rr_journal', JSON.stringify(journal)); }
function saveTalk(){ localStorage.setItem('rr_talk', JSON.stringify(talk)); }
function flipTo(side){
  document.querySelectorAll('.side-btn').forEach(b=>b.classList.toggle('active', b.dataset.side===side));
  ['A','B','C'].forEach(s=>document.getElementById('panel-'+s).classList.toggle('active', s===side));
}
function escapeHtml(str){ const d=document.createElement('div'); d.textContent=str||''; return d.innerHTML; }
function renderChips(containerId, items, filterVal, onClick){
  const genres = [...new Set(items.map(i=>i.genre).filter(Boolean))];
  const el = document.getElementById(containerId);
  if(genres.length===0){ el.innerHTML=''; return; }
  el.innerHTML = ['all', ...genres].map(g => {
    const active = g===filterVal;
    const color = g==='all' ? '#C6FF4D' : genreColor(g);
    return `<button class="chip${active?' active':''}" style="${active?'background:'+color+';':''}" onclick="${onClick}('${g.replace(/'/g,"\\'")}')">${escapeHtml(g)}</button>`;
  }).join('');
}
function setLibFilter(g){ libFilter=g; renderSongs(); }
function setTalkFilter(g){ talkFilter=g; renderTalk(); }
function renderSongs(){
  renderChips('genre-chips-lib', songs, libFilter, 'setLibFilter');
  const q = (document.getElementById('song-search').value||'').toLowerCase();
  const filtered = songs.filter(s =>
    (libFilter==='all' || s.genre===libFilter) &&
    (s.title.toLowerCase().includes(q) || (s.artist||'').toLowerCase().includes(q))
  );
  const list = document.getElementById('song-list');
  if(filtered.length===0){
    list.innerHTML = `<p class="empty">${songs.length===0?'No tracks yet — add your first one above.':'Nothing matches.'}</p>`;
    return;
  }
  list.innerHTML = filtered.map(s=>{
    const i = songs.indexOf(s);
    return `<div class="track">
      <span class="num">${String(i+1).padStart(2,'0')}</span>
      <span class="info"><strong>${escapeHtml(s.title)}</strong>
      <span>${escapeHtml(s.artist||'')}${s.album?' · '+escapeHtml(s.album):''}
      <span class="tag" style="background:${genreColor(s.genre)}">${escapeHtml(s.genre||'')}</span></span></span>
      <span class="dur">${escapeHtml(s.duration||'')}<button class="del" onclick="deleteSong(${i})">remove</button></span>
    </div>`;
  }).join('');
}
function renderJournal(){
  const list = document.getElementById('journal-list');
  if(journal.length===0){ list.innerHTML='<p class="empty">No entries yet.</p>'; return; }
  list.innerHTML = journal.slice().reverse().map(e=>{
    const i = journal.indexOf(e);
    return `<div class="entry">
      <span class="entry-date">${escapeHtml(e.date)}</span>
      <h3>${escapeHtml(e.title)}</h3>
      <p>${escapeHtml(e.body)}</p>
      <button class="del" onclick="deleteEntry(${i})">remove</button>
    </div>`;
  }).join('');
}
function renderTalk(){
  renderChips('genre-chips-talk', talk, talkFilter, 'setTalkFilter');
  const filtered = talk.filter(t => talkFilter==='all' || t.genre===talkFilter);
  const list = document.getElementById('talk-list');
  if(filtered.length===0){ list.innerHTML='<p class="empty">No posts yet — start the conversation.</p>'; return; }
  list.innerHTML = filtered.slice().reverse().map(t=>{
    const i = talk.indexOf(t);
    return `<div class="post" style="border-left-color:${genreColor(t.genre)}">
      <div class="post-head">
        <span class="post-name">${escapeHtml(t.name)}</span>
        <span class="tag" style="background:${genreColor(t.genre)}">${escapeHtml(t.genre)}</span>
        <span class="post-time">${escapeHtml(t.time)}</span>
        <button class="del" onclick="deleteTalk(${i})">remove</button>
      </div>
      <p>${escapeHtml(t.body)}</p>
    </div>`;
  }).join('');
}
document.getElementById('song-form').addEventListener('submit', e=>{
  e.preventDefault();
  songs.push({
    title: document.getElementById('s-title').value.trim(),
    artist: document.getElementById('s-artist').value.trim(),
    genre: document.getElementById('s-genre').value.trim(),
    album: document.getElementById('s-album').value.trim(),
    duration: document.getElementById('s-duration').value.trim()
  });
  e.target.reset(); renderSongs(); saveSongs();
});
document.getElementById('journal-form').addEventListener('submit', e=>{
  e.preventDefault();
  journal.push({
    title: document.getElementById('j-title').value.trim(),
    body: document.getElementById('j-body').value.trim(),
    date: new Date().toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'})
  });
  e.target.reset(); renderJournal(); saveJournal();
});
document.getElementById('talk-form').addEventListener('submit', e=>{
  e.preventDefault();
  talk.push({
    name: document.getElementById('t-name').value.trim(),
    genre: document.getElementById('t-genre').value.trim(),
    body: document.getElementById('t-body').value.trim(),
    time: new Date().toLocaleString(undefined,{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'})
  });
  e.target.reset(); renderTalk(); saveTalk();
});
function deleteSong(i){ songs.splice(i,1); renderSongs(); saveSongs(); }
function deleteEntry(i){ journal.splice(i,1); renderJournal(); saveJournal(); }
function deleteTalk(i){ talk.splice(i,1); renderTalk(); saveTalk(); }
renderAll();
</script>
</body>
</html>
